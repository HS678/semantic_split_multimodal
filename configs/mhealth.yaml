seed: 42
device: auto
experiment_name: mhealth_three_stage

results:
  base_dir: ./local/results

# MHEALTH contains 10 subject log files:
#   local/datasets/mhealth/mHealth_subject1.log
#   ...
#   local/datasets/mhealth/mHealth_subject10.log
dataset:
  type: mhealth
  root: ./local/datasets/mhealth
  modality_scheme: sensor_type
  train_subjects: [1, 2, 3, 4, 5, 6, 7, 8]
  test_subjects: [9, 10]
  window_size: 128
  stride: 64
  drop_null: true
  min_label_purity: 0.6
  normalize: true

num_modalities: 4
num_classes: 12
encoder_hidden_dim: 128
learning_rate: 0.001
batch_size: 32

model:
  encoder:
    type: time_series
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1
  server:
    hidden_dim: 128
    num_layers: 1
    dropout: 0.0
    adapter_dim: 128
    semantic_dim: 128

partition:
  output_dir: ./local/results/data_partition
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

cluster:
  output_dir: ./local/results/cluster
  method: isodata
  known_k: null
  isodata:
    max_iter: 30
    min_cluster_size: 2
    initial_k: 4
    min_clusters: 1
    max_clusters: null
    split_std_threshold: 1.0
    merge_distance_threshold: 0.25

training:
  multimodal_mode: mmbind_fusion_split_learning
  scheduler: proposed_cluster_coverage
  global_rounds: 50
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  eval_every: 5
  clients_per_round: 12
  client_lr: 0.001
  server_lr: 0.001

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0

alignment:
  enabled: false
  type: prototype
  lambda_align: 0.05
  ema_momentum: 0.9

evaluation:
  metrics: [accuracy, macro_f1, per_modality_accuracy]

result:
  output_dir: ./local/logs

result_model:
  output_dir: ./local/checkpoints

d2d:
  enabled: false
