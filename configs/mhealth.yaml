seed: 42
device: auto
experiment_name: mhealth_three_stage

results:
  base_dir: ./results

# MHEALTH contains 10 subject log files:
#   data/MHEALTHDATASET/mHealth_subject1.log
#   ...
#   data/MHEALTHDATASET/mHealth_subject10.log
dataset:
  type: mhealth
  root: ./data/MHEALTHDATASET
  modality_scheme: sensor_type
  train_subjects: [1, 2, 3, 4, 5, 6, 7, 8]
  test_subjects: [9, 10]
  window_size: 128
  stride: 64
  drop_null: true
  min_label_purity: 0.6
  normalize: true

num_modalities: 4
num_classes: 12
encoder_hidden_dim: 128
learning_rate: 0.001
batch_size: 32

model:
  encoder:
    # MHEALTH windows are temporal tensors:
    # sensor-type modalities:
    # accelerometer: [N, 9, 128], gyroscope/magnetometer: [N, 6, 128], ecg: [N, 2, 128].
    type: cnn_gru
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1

partition:
  output_dir: ./results/data_partition
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  batch_size: 64
  max_batches: 4

cluster:
  output_dir: ./results/cluster
  method: isodata
  known_k: null
  fingerprint_source: signal_stats
  use_input_dim_hint: false
  use_signal_stats: true
  signal_stats_include_input_dim: true
  signal_stats_input_dim_repeat: 8
  input_dim_hint_mode: append
  input_dim_hint_repeat: 64
  isodata:
    max_iter: 30
    min_cluster_size: 2
    initial_k: 4
    min_clusters: 4
    max_clusters: 4
    split_std_threshold: 1.0
    merge_distance_threshold: 0.25

training:
  global_rounds: 50
  batch_size: 64
  eval_batch_size: 128
  eval_every: 5
  clients_per_cluster_per_round: 4
  client_lr: 0.001
  server_lr: 0.001

alignment:
  enabled: true
  type: classwise_mse
  lambda_align: 0.05
  temperature: 0.2

result:
  output_dir: ./results/logs

result_model:
  output_dir: ./results/models

d2d:
  enabled: false
