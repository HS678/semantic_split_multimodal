seed: 42
device: auto
experiment_name: uci_har_three_stage

results:
  base_dir: ./local/results

# UCI-HAR should contain train/test folders and train/test/Inertial Signals/*.txt files.
dataset:
  # dataset.type is resolved by src/semantic_split_multimodal/data/registry.py.
  # Add a loader there when introducing a new dataset.
  type: uci_har
  root: ./local/datasets/uci_har

num_modalities: 2
num_classes: 6
encoder_hidden_dim: 128
learning_rate: 0.001
batch_size: 32

model:
  encoder:
    type: time_series
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1
  server:
    hidden_dim: 128
    num_layers: 1
    dropout: 0.0
    adapter_dim: 128
    semantic_dim: 128

partition:
  output_dir: ./local/results/data_partition
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

cluster:
  output_dir: ./local/results/cluster
  method: adaptive_isodata
  known_k: null
  adaptive:
    seeds: [11, 23, 37, 53, 71]
    max_iter: 20
    pca_variance: 0.95
    variance_epsilon: 1.0e-8
    q_max: 8
    min_cluster_size: 2
    min_cluster_size_fraction: null
    bic_improvement_min: 0.0
    min_split_silhouette: 0.20
    silhouette_patience: 2
    stability_min_ari: 0.75
    split_kmeans_restarts: 50

training:
  scheduler: balanced_cluster_round_robin
  global_rounds: 50
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  eval_every: 5
  clients_per_cluster_per_round: 4
  client_lr: 0.001
  server_lr: 0.001

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0

evaluation:
  metrics: [accuracy, macro_f1, per_modality_accuracy]

result:
  output_dir: ./local/logs

result_model:
  output_dir: ./local/checkpoints

d2d:
  enabled: false
