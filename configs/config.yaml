# 配置字段参考模板
#
# 本文件用于说明当前 MMBind-style Fusion Split Learning 三阶段实验的配置字段、
# 含义和可选值。正式实验请复制对应数据集配置（uci_har.yaml、mhealth.yaml、
# pamap2.yaml 或 cmu_mosei.yaml）后修改，不建议直接运行本参考文件。

# 全局随机种子。正式基础配置使用 42；Stage 3 CLI 的 --seed 只覆盖本次 Stage 3。
seed: 42

# 运行设备：auto（自动选择）、cpu、cuda、cuda:0 等 PyTorch device 字符串。
device: auto

# 实验名称，仅用于标识和元数据记录。
experiment_name: dataset_three_stage

results:
  # Stage 1 partition、Stage 2 cluster 和 Stage 3 experiments 的统一结果根目录。
  base_dir: ./local/results

dataset:
  # 数据集 loader。可选：uci_har、mhealth、pamap2、cmu_mosei。
  type: uci_har

  # 原始数据目录；相对路径以项目根目录为基准。
  root: ./local/datasets/uci_har

  # 数据划分协议：
  # - uci_har、mhealth、pamap2：subject_disjoint_tvt_v1
  # - cmu_mosei：official_video_disjoint_tvt_v1
  split_protocol: subject_disjoint_tvt_v1

  # 仅适用于 uci_har、mhealth、pamap2。三组 subject 必须非空且互不重叠。
  train_subjects: []
  validation_subjects: []
  test_subjects: []

  # 仅适用于 mhealth、pamap2。模态组织方式：sensor_type 或 position。
  modality_scheme: sensor_type

  # 仅适用于 mhealth、pamap2。滑动窗口长度、步长及窗口最低标签纯度。
  window_size: 128
  stride: 64
  min_label_purity: 0.6

  # 仅适用于 mhealth。true 表示删除 null/activity 0 样本。
  drop_null: true

  # 仅适用于 pamap2。true 表示删除 other/activity 0 样本。
  drop_other: true

  # 仅适用于 pamap2。是否把 heart rate 作为模态输入。
  include_heart_rate: false

  # 是否使用仅由 train split 拟合的统计量进行标准化。
  normalize: true

  # 以下字段仅适用于 cmu_mosei。
  features_dir: features
  splits_dir: splits
  text_file: BERT_MOSEI.pkl
  audio_file: COAVAREP_aligned_MOSEI.pkl
  visual_file: FACET_aligned_MOSEI.pkl
  train_split_file: df_MOSEI.tsv
  validation_split_file: df_valid_MOSEI.tsv
  test_split_file: df_test_MOSEI.tsv
  # 当前正式协议固定为二分类情感任务、负/非负标签和时间维 mean pooling。
  task: binary_sentiment
  label_protocol: negative_vs_non_negative
  temporal_pooling: mean

# 分类类别数：UCI-HAR=6，MHEALTH=12，PAMAP2=12，CMU-MOSEI=2。
num_classes: 6

# 客户端 encoder 输出维度，也是 ClusterAdapter 的输入维度。
encoder_hidden_dim: 128

model:
  encoder:
    # encoder 类型：time_series（传感器数据）或 mlp（CMU-MOSEI 特征）。
    type: time_series
    # 以下三个字段用于 time_series encoder。
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1

partition:
  # Stage 1 中每个真实模态拆分出的单模态客户端数量。
  clients_per_modality: 10

pretrain:
  # Stage 2 客户端 encoder 预训练参数。
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  # 每个客户端最多使用的预训练样本数；null 表示不限制。
  max_samples: null

fingerprint:
  # fingerprint 类型：encoder、signal 或 hybrid。
  type: hybrid
  batch_size: 64
  # 每个客户端最多用于 fingerprint 提取的 batch 数。
  max_batches: 4

fingerprint_visualization:
  # 是否在 Stage 2 完成后生成 client fingerprint 的论文级 PCA 审计图。
  enabled: true
  # 当前论文主图固定为 pca；坐标只使用 fingerprint 计算。
  method: pca
  # PCA 前是否按 fingerprint 维度进行标准化。
  standardize: true
  # 点旁是否标注 client_id；客户端较多时建议关闭。
  show_client_ids: false
  # 是否绘制按审计标签分组的协方差椭圆。
  show_ellipses: true
  ellipse_confidence: 0.95
  # PNG 预览分辨率；PDF 始终为矢量格式。
  png_dpi: 600

cluster:
  # Stage 2 聚类方法：adaptive_isodata 或 kmeans。
  method: adaptive_isodata
  # kmeans 时填写正整数 K；adaptive_isodata 时必须为 null。
  known_k: null
  adaptive:
    # adaptive_isodata 多次初始化使用的种子。
    seeds: [11, 23, 37, 53, 71]
    max_iter: 20
    # PCA 保留的累计方差比例，范围 (0, 1]。
    pca_variance: 0.95
    # 数值稳定用的最小方差阈值。
    variance_epsilon: 1.0e-8
    # 自适应搜索允许的最大簇数。
    q_max: 8
    # 最小簇大小；也可用 min_cluster_size_fraction 按客户端比例约束。
    min_cluster_size: 2
    min_cluster_size_fraction: null
    # 接受 split 所需的 BIC 最小改善量。
    bic_improvement_min: 0.0
    # 接受 split 所需的最小 silhouette。
    min_split_silhouette: 0.20
    # silhouette 连续不改善时的容忍次数。
    silhouette_patience: 2
    # 多次聚类结果之间要求的最小 ARI 稳定性。
    stability_min_ari: 0.75
    # 每次二分使用的 KMeans 重启次数。
    split_kmeans_restarts: 50

training:
  # Stage 3 使用的客户端簇分配来源：
  # - pred_cluster：默认正式主线，读取 pred_cluster.csv。
  # - true_cluster：仅 oracle/debug，读取 true_cluster.csv，并用于 scheduler、binding、
  #   fusion slot 和 evaluation mapping；存在真实模态泄漏，不得作为正式主结果。
  cluster_assignment_source: pred_cluster

  # 当前正式 scheduler，按所选 cluster assignment 均衡随机轮询。
  scheduler: balanced_cluster_round_robin
  global_rounds: 200
  # 每轮执行的本地 Split Learning step 数。
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  # 每隔多少轮执行一次 naturally paired validation。
  validation_every: 10
  early_stopping:
    # 连续多少次 validation 未改善后停止。
    patience: 3
    # 达到此轮数后才允许 early stopping。
    min_rounds: 50
    # validation macro-F1 至少增加此数值才算改善。
    min_delta: 0.001
  # 每轮从每个所选簇调度的客户端数量。
  clients_per_cluster_per_round: 4
  client_lr: 0.001
  server_lr: 0.001

binding:
  # 当前正式方法：label_random，即 label-guided semantic pseudo binding。
  type: label_random
  batch_size: 64

fusion:
  # 当前正式结构：ClusterAdapter + concat MLP fusion + classifier。
  type: concat_mlp
  # 融合训练机制：
  # - label_random_ce：原有方法，仅在完整同标签伪元组上计算分类 CE（默认）。
  # - mmbind_weighted_contrastive：完整伪元组 CE + 跨预测簇加权 group contrastive
  #   + 单簇保留/其他槽置零的异构输入 CE。两种机制均保持同一推理结构。
  training_objective: label_random_ce
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0
  mmbind:
    # 跨预测簇余弦相似度的 temperature。
    temperature: 0.1
    # 加权 group contrastive loss 系数。
    contrastive_weight: 0.1
    # MMBind 异构模态组合（dummy slot）分类 loss 系数。
    heterogeneous_ce_weight: 0.5

d2d:
  # 当前正式路线不启用 device-to-device 扩展。
  enabled: false
