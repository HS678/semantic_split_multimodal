seed: 42
device: auto
experiment_name: cmu_mosei_binary_sentiment_three_stage

results:
  base_dir: ./local/results

# Required files:
#   local/datasets/cmu_mosei/features/BERT_MOSEI.pkl
#   local/datasets/cmu_mosei/features/COAVAREP_aligned_MOSEI.pkl
#   local/datasets/cmu_mosei/features/FACET_aligned_MOSEI.pkl
#   local/datasets/cmu_mosei/splits/df_MOSEI.tsv
#   local/datasets/cmu_mosei/splits/df_valid_MOSEI.tsv
#   local/datasets/cmu_mosei/splits/df_test_MOSEI.tsv
dataset:
  type: cmu_mosei
  root: ./local/datasets/cmu_mosei
  split_protocol: official_video_disjoint_tvt_v1
  features_dir: features
  splits_dir: splits
  text_file: BERT_MOSEI.pkl
  audio_file: COAVAREP_aligned_MOSEI.pkl
  visual_file: FACET_aligned_MOSEI.pkl
  train_split_file: df_MOSEI.tsv
  validation_split_file: df_valid_MOSEI.tsv
  test_split_file: df_test_MOSEI.tsv
  task: binary_sentiment
  label_protocol: negative_vs_non_negative
  temporal_pooling: mean
  normalize: true

num_classes: 2
encoder_hidden_dim: 128

model:
  encoder:
    type: mlp

partition:
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

cluster:
  method: adaptive_isodata
  known_k: null
  adaptive:
    seeds: [11, 23, 37, 53, 71]
    max_iter: 20
    pca_variance: 0.95
    variance_epsilon: 1.0e-8
    q_max: 8
    min_cluster_size: 2
    min_cluster_size_fraction: null
    bic_improvement_min: 0.0
    min_split_silhouette: 0.20
    silhouette_patience: 2
    stability_min_ari: 0.75
    split_kmeans_restarts: 50

training:
  # Debug/oracle only: set to true_cluster to bypass predicted clustering in Stage 3.
  cluster_assignment_source: true_cluster
  scheduler: balanced_cluster_round_robin
  global_rounds: 200
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  validation_every: 10
  early_stopping:
    patience: 3
    min_rounds: 50
    min_delta: 0.001
  clients_per_cluster_per_round: 4
  client_lr: 0.001
  server_lr: 0.001

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0

d2d:
  enabled: false
