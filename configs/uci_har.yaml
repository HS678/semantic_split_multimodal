seed: 42
device: auto
experiment_name: uci_har_three_stage

results:
  base_dir: ./results

# UCI-HAR should contain train/test folders and train/test/Inertial Signals/*.txt files.
dataset:
  # dataset.type is resolved by data/dataset_registry.py.
  # Add a loader there when introducing a new dataset.
  type: uci_har
  root: ./data/uci-har

num_modalities: 2
num_classes: 6
encoder_hidden_dim: 128
learning_rate: 0.001
batch_size: 32

model:
  encoder:
    type: time_series
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1
  server:
    hidden_dim: 128
    num_layers: 1
    dropout: 0.0
    adapter_dim: 128
    semantic_dim: 128

partition:
  output_dir: ./results/data_partition
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

cluster:
  output_dir: ./results/cluster
  method: isodata
  known_k: null
  isodata:
    max_iter: 20
    min_cluster_size: 2
    initial_k: 2
    min_clusters: 1
    max_clusters: null
    split_std_threshold: 1.25
    merge_distance_threshold: 0.25

training:
  multimodal_mode: mmbind_fusion_split_learning
  scheduler: proposed_cluster_coverage
  global_rounds: 50
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  eval_every: 5
  clients_per_round: 8
  client_lr: 0.001
  server_lr: 0.001

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0

alignment:
  enabled: false
  type: prototype
  lambda_align: 0.05
  ema_momentum: 0.9

evaluation:
  metrics: [accuracy, macro_f1, per_modality_accuracy]

result:
  output_dir: ./results/logs

result_model:
  output_dir: ./results/models

d2d:
  enabled: false
