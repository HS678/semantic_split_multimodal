seed: 42
device: auto
experiment_name: uci_har_three_stage

results:
  base_dir: ./local/results

# UCI-HAR should contain train/test folders and train/test/Inertial Signals/*.txt files.
dataset:
  # dataset.type is resolved by src/semantic_split_multimodal/data/registry.py.
  # Add a loader there when introducing a new dataset.
  type: uci_har
  root: ./local/datasets/uci_har
  split_protocol: subject_disjoint_tvt_v1
  train_subjects: [1, 3, 5, 6, 7, 8, 11, 15, 16, 17, 21, 22, 26, 27, 28, 29, 30]
  validation_subjects: [14, 19, 23, 25]
  test_subjects: [2, 4, 9, 10, 12, 13, 18, 20, 24]

num_classes: 6
encoder_hidden_dim: 128

model:
  encoder:
    type: time_series
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1

partition:
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

cluster:
  method: adaptive_isodata
  known_k: null
  adaptive:
    seeds: [11, 23, 37, 53, 71]
    max_iter: 20
    pca_variance: 0.95
    variance_epsilon: 1.0e-8
    q_max: 8
    min_cluster_size: 2
    min_cluster_size_fraction: null
    bic_improvement_min: 0.0
    min_split_silhouette: 0.20
    silhouette_patience: 2
    stability_min_ari: 0.75
    split_kmeans_restarts: 50

training:
  # Debug/oracle only: set to true_cluster to bypass predicted clustering in Stage 3.
  cluster_assignment_source: true_cluster
  scheduler: balanced_cluster_round_robin
  global_rounds: 200
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  validation_every: 10
  early_stopping:
    patience: 3
    min_rounds: 50
    min_delta: 0.001
  clients_per_cluster_per_round: 4
  client_lr: 0.001
  server_lr: 0.001

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0

d2d:
  enabled: false
