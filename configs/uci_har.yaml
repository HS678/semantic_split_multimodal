seed: 42
device: auto
experiment_name: uci_har_three_stage

# UCI-HAR should contain train/test folders and train/test/Inertial Signals/*.txt files.
dataset:
  # dataset.type is resolved by data/dataset_registry.py.
  # Add a loader there when introducing a new dataset.
  type: uci_har
  root: ./data/uci-har

num_modalities: 2
num_classes: 6
encoder_hidden_dim: 128
learning_rate: 0.001
batch_size: 32

model:
  encoder:
    # UCI-HAR inertial signals are temporal tensors, so use a 1D Conv + GRU encoder.
    # Other datasets can switch this to "mlp" or register/use future encoder types.
    type: cnn_gru
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1

partition:
  output_dir: ./results/data_partition
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  batch_size: 64
  max_batches: 4

cluster:
  output_dir: ./results/cluster
  method: isodata   # kmeans or isodata
  # null lets ISODATA produce Q_star from its split/merge constraints.
  # UCI-HAR is a two-modality sanity-check dataset, so min/max clusters are fixed to 2 below.
  known_k: null
  # Uses client input dimensions as non-label structural hints for clustering.
  # This does not read true modality_name and is intended as a structural cue/upper-bound option.
  use_input_dim_hint: true
  input_dim_hint_mode: append
  input_dim_hint_repeat: 64
  isodata:
    max_iter: 20
    min_cluster_size: 2
    initial_k: 2
    min_clusters: 2
    max_clusters: 2
    split_std_threshold: 1.25
    merge_distance_threshold: 0.25

training:
  global_rounds: 50
  batch_size: 64
  eval_batch_size: 128
  eval_every: 5
  clients_per_cluster_per_round: 4  # r; K_t = Q_star * r
  client_lr: 0.001
  server_lr: 0.001

alignment:
  # MMFed-style same-label cross-modal representation alignment.
  enabled: true
  type: classwise_mse
  lambda_align: 0.05
  temperature: 0.2

result:
  output_dir: ./results/logs

result_model:
  output_dir: ./results/models

# Reserved only. Real D2D training/offloading logic is intentionally not implemented in this phase.
d2d:
  enabled: false
