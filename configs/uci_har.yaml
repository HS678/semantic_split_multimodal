seed: 42
device: auto
experiment_name: uci_har_stage2

dataset:
  type: uci_har
  root: ./data/uci-har

num_modalities: 2
num_classes: 6
input_dim: 384
encoder_hidden_dim: 128
projected_dim: 64

clients_per_modality: 10
batch_size: 32
local_steps_per_round: 3
global_rounds: 3
learning_rate: 0.001

label_skew_alpha: 0.4
min_labels_per_client_ratio: 0.5

lambda_cls: 1.0
lambda_align: 0.2
lambda_proto: 0.0
temperature: 0.1

scheduler:
  name: fair_random_full_modality

cluster:
  method: kmeans
  known_k: 2

clustering:
  use_oracle_clusters_for_training: true
