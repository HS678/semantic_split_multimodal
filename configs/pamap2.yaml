seed: 42
device: auto
experiment_name: pamap2_three_stage

results:
  base_dir: ./local/results

# PAMAP2 Protocol data:
#   local/datasets/pamap2/PAMAP2_Dataset/PAMAP2_Dataset/Protocol/subject101.dat
#   ...
#   subject109.dat
dataset:
  type: pamap2
  root: ./local/datasets/pamap2
  modality_scheme: sensor_type
  include_heart_rate: false
  train_subjects: [101, 102, 103, 104, 105, 106, 107]
  test_subjects: [108, 109]
  window_size: 128
  stride: 128
  drop_other: true
  min_label_purity: 0.6
  normalize: true

num_modalities: 3
num_classes: 12
encoder_hidden_dim: 128
learning_rate: 0.001
batch_size: 32

model:
  encoder:
    type: time_series
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1
  server:
    hidden_dim: 256
    num_layers: 2
    dropout: 0.1
    adapter_dim: 128
    semantic_dim: 128

partition:
  output_dir: ./local/results/data_partition
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

cluster:
  output_dir: ./local/results/cluster
  method: isodata
  known_k: null
  isodata:
    max_iter: 30
    min_cluster_size: 2
    initial_k: 3
    min_clusters: 1
    max_clusters: null
    split_std_threshold: 1.0
    merge_distance_threshold: 0.25

training:
  scheduler: proposed_cluster_coverage
  global_rounds: 100
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  eval_every: 5
  clients_per_round: 12
  client_lr: 0.0005
  server_lr: 0.0005

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0

evaluation:
  metrics: [accuracy, macro_f1, per_modality_accuracy]

result:
  output_dir: ./local/logs

result_model:
  output_dir: ./local/checkpoints

d2d:
  enabled: false
