seed: 42
device: auto
experiment_name: pamap2_three_stage

results:
  base_dir: ./local/results

# PAMAP2 Protocol data:
#   local/datasets/pamap2/PAMAP2_Dataset/PAMAP2_Dataset/Protocol/subject101.dat
#   ...
#   subject109.dat
dataset:
  type: pamap2
  root: ./local/datasets/pamap2
  split_protocol: subject_disjoint_tvt_v1
  modality_scheme: sensor_type
  include_heart_rate: false
  train_subjects: [101, 102, 103, 105, 107]
  validation_subjects: [104, 106]
  test_subjects: [108, 109]
  window_size: 128
  stride: 128
  drop_other: true
  min_label_purity: 0.6
  normalize: true

num_classes: 12
encoder_hidden_dim: 128

model:
  encoder:
    type: time_series
    conv_channels: [64, 128]
    kernel_sizes: [5, 3]
    dropout: 0.1

partition:
  clients_per_modality: 10

pretrain:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_samples: null

fingerprint:
  type: hybrid
  batch_size: 64
  max_batches: 4

fingerprint_visualization:
  enabled: true
  method: pca
  standardize: true
  show_client_ids: false
  show_ellipses: true
  ellipse_confidence: 0.95
  png_dpi: 600

cluster:
  method: adaptive_isodata
  known_k: null
  adaptive:
    seeds: [11, 23, 37, 53, 71]
    max_iter: 20
    pca_variance: 0.95
    variance_epsilon: 1.0e-8
    q_max: 8
    min_cluster_size: 2
    min_cluster_size_fraction: null
    bic_improvement_min: 0.0
    min_split_silhouette: 0.20
    silhouette_patience: 2
    stability_min_ari: 0.75
    split_kmeans_restarts: 50

training:
  # Debug/oracle only: set to true_cluster to bypass predicted clustering in Stage 3.
  cluster_assignment_source: true_cluster
  scheduler: balanced_cluster_round_robin
  global_rounds: 200
  local_steps: 1
  batch_size: 64
  eval_batch_size: 128
  validation_every: 10
  early_stopping:
    patience: 3
    min_rounds: 50
    min_delta: 0.001
  clients_per_cluster_per_round: 4
  client_lr: 0.0005
  server_lr: 0.0005

binding:
  type: label_random
  batch_size: 64

fusion:
  type: concat_mlp
  training_objective: label_random_ce
  adapter_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0
  mmbind:
    temperature: 0.1
    contrastive_weight: 0.1
    heterogeneous_ce_weight: 0.5

d2d:
  enabled: false
