seed: 42
device: auto
experiment_name: ablation_kmeans_clusters

dataset:
  type: synthetic
  root: ./data
  train_file: train_paired.npz
  test_file: test_paired.npz
  full_file: ""

num_modalities: 3
num_classes: 6
input_dim: 32
encoder_hidden_dim: 64
projected_dim: 32

train_samples: 3600
test_samples: 900
clients_per_modality: 6
train_split_ratio: 0.8

batch_size: 24
local_steps_per_round: 5
global_rounds: 5
learning_rate: 0.001

label_skew_alpha: 0.4
min_labels_per_client_ratio: 0.5

lambda_cls: 1.0
lambda_align: 0.2
lambda_proto: 0.0
temperature: 0.1

scheduler:
  name: fair_random_full_modality

cluster:
  method: kmeans
  known_k: 3

clustering:
  use_oracle_clusters_for_training: false
